<header class="sticky top-0 left-0 right-0 z-50 bg-white shadow-lg transition-all duration-300" [class.bg-white/95]="isScrolled()" [class.backdrop-blur-md]="isScrolled()">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center space-x-3 group">
              <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-green-600 rounded-lg flex items-center justify-center shadow-lg group-hover:shadow-xl transition-all duration-300">
                <i class="fas fa-battery-three-quarters text-white text-xl"></i>
              </div>
          <div class="flex flex-col">
            <span class="text-xl font-bold text-gray-900">Totoogo</span>
            <span class="text-xs text-green-600 font-medium">Battery Solutions</span>
          </div>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <!-- Our Offerings Dropdown -->
        <div class="relative group">
          <button (click)="navigateToServices()" class="text-gray-700 hover:text-green-600 font-medium transition-colors duration-200 flex items-center space-x-1">
            <span>Our Offerings</span>
            <svg class="w-4 h-4 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div class="absolute top-full left-0 mt-2 w-64 bg-white rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
            <div class="py-2">
              <a routerLink="/services" class="block px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-600 transition-colors duration-200">
                <div class="font-semibold">Fleet Operators</div>
                <div class="text-sm text-gray-500">Battery solutions for fleet management</div>
              </a>
              <a routerLink="/services" class="block px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-600 transition-colors duration-200">
                <div class="font-semibold">EV Drivers</div>
                <div class="text-sm text-gray-500">Individual battery swapping services</div>
              </a>
              <a routerLink="/services" class="block px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-600 transition-colors duration-200">
                <div class="font-semibold">Franchise Partners</div>
                <div class="text-sm text-gray-500">Join our network as a partner</div>
              </a>
            </div>
          </div>
        </div>
        <a routerLink="/about" class="text-gray-700 hover:text-green-600 font-medium transition-colors duration-200">About Us</a>
        <a routerLink="/contact" class="text-gray-700 hover:text-green-600 font-medium transition-colors duration-200">Contact Us</a>
      </nav>

      <!-- CTA Button -->
      <div class="hidden md:flex items-center space-x-4">
        <a routerLink="/contact" class="bg-gradient-to-r from-green-500 to-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:from-green-600 hover:to-green-700 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
          Get in Touch
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="text-gray-700 hover:text-green-600 focus:outline-none focus:text-green-600 transition-colors duration-200">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="md:hidden" [class.hidden]="!isMenuOpen()">
      <div class="px-2 pt-2 pb-3 space-y-1 bg-white border-t border-gray-200">
        <a routerLink="/services" (click)="closeMenu()" class="block px-3 py-2 text-base font-medium text-gray-700 hover:text-green-600 hover:bg-green-50 rounded-md transition-colors duration-200">Our Offerings</a>
        <a routerLink="/about" (click)="closeMenu()" class="block px-3 py-2 text-base font-medium text-gray-700 hover:text-green-600 hover:bg-green-50 rounded-md transition-colors duration-200">About Us</a>
        <a routerLink="/contact" (click)="closeMenu()" class="block px-3 py-2 text-base font-medium text-gray-700 hover:text-green-600 hover:bg-green-50 rounded-md transition-colors duration-200">Contact Us</a>
        <div class="pt-4">
          <a routerLink="/contact" (click)="closeMenu()" class="block w-full bg-gradient-to-r from-green-500 to-green-600 text-white px-4 py-2 rounded-lg font-semibold text-center hover:from-green-600 hover:to-green-700 transition-all duration-300">
            Get in Touch
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
